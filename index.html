<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jazyky">
  <title>Jazyky</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="sheet">
      <header class="sheet-head">
        <h2 id="settings-title">Nastavení</h2>
        <button class="sheet-done" value="close">Hotovo</button>
      </header>

      <p class="group-label">Výslovnost</p>
      <div class="group">
        <div class="field">
          <span class="field-label">Rychlost řeči <b class="rate-val"></b></span>
          <div class="field-row">
            <input type="range" name="rate" min="0.6" max="1.2" step="0.05" aria-label="Rychlost řeči">
            <button type="button" class="chip" data-test>Vyzkoušet</button>
          </div>
        </div>
        <label class="toggle"><span>Přehrávat výslovnost automaticky</span><input type="checkbox" name="autoSpeak"></label>
      </div>
      <p class="group-note voices"></p>

      <fieldset class="field-set">
        <legend class="group-label">Španělská výslovnost</legend>
        <div class="group">
          <label class="radio"><span>Latinská Amerika</span><input type="radio" name="esVoice" value="latam"></label>
          <label class="radio"><span>Španělsko</span><input type="radio" name="esVoice" value="es"></label>
        </div>
      </fieldset>

      <p class="group-label">Časování</p>
      <div class="group">
        <label class="toggle"><span>Procvičovat i tvary pro <i>vosotros</i></span><input type="checkbox" name="vosotros"></label>
      </div>

      <p class="group-label">Záloha</p>
      <div class="group">
        <div class="field backup">
          <div class="field-row">
            <button type="button" class="btn" data-export>Stáhnout zálohu</button>
            <label class="btn">Nahrát zálohu<input type="file" accept=".json,application/json" data-import hidden></label>
          </div>
        </div>
      </div>
      <p class="group-note">Pokrok a vlastní slovíčka jsou uložené jen v tomto prohlížeči. Zálohou je přeneseš do jiného zařízení.</p>
    </form>
  </dialog>

  <script src="data/es.js"></script>
  <script src="data/ru.js"></script>
  <script src="app.js"></script>
</body>
</html>
