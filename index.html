<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jazyky">
  <title>Jazyky</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="sheet">
      <h2 id="settings-title">Nastavení</h2>

      <div class="field">
        <span class="field-label">Rychlost řeči <b class="rate-val"></b></span>
        <div class="field-row">
          <input type="range" name="rate" min="0.6" max="1.2" step="0.05">
          <button type="button" class="chip" data-test>Vyzkoušet</button>
        </div>
        <p class="voices small muted"></p>
      </div>

      <label class="toggle"><input type="checkbox" name="autoSpeak"><span>Přehrávat výslovnost automaticky</span></label>

      <fieldset class="field">
        <legend class="field-label">Španělská výslovnost</legend>
        <label class="radio"><input type="radio" name="esVoice" value="latam"><span>Latinská Amerika</span></label>
        <label class="radio"><input type="radio" name="esVoice" value="es"><span>Španělsko</span></label>
      </fieldset>

      <label class="toggle"><input type="checkbox" name="vosotros"><span>Procvičovat i tvary pro <i>vosotros</i></span></label>

      <div class="field">
        <span class="field-label">Záloha</span>
        <p class="small muted">Pokrok a vlastní slovíčka jsou uložené jen v tomto prohlížeči. Zálohou je přeneseš do jiného zařízení.</p>
        <div class="field-row">
          <button type="button" class="btn" data-export>Stáhnout zálohu</button>
          <label class="btn">Nahrát zálohu<input type="file" accept=".json,application/json" data-import hidden></label>
        </div>
      </div>

      <button class="btn primary wide" value="close">Hotovo</button>
    </form>
  </dialog>

  <script src="data/es.js"></script>
  <script src="data/ru.js"></script>
  <script src="app.js"></script>
</body>
</html>
